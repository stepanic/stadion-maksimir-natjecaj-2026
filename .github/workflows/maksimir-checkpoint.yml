# Svaki sat: snapshot glasanja javnosti → OpenTimestamps → Bitcoin.
# Nove checkpointe i nadograđene .ots potvrde commita natrag u repo, gdje ih
# web čita preko raw.githubusercontent.com. Ne treba nikakva tajna.
name: maksimir-checkpoint

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Zapiši checkpoint i bez promjene vrha lanca"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: maksimir-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opentimestamps-client
      - run: python3 scripts/maksimir_checkpoint.py ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "maksimir-checkpoint[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glasanje/checkpoints
          if git diff --cached --quiet; then echo "nema promjena"; exit 0; fi
          git commit -m "chore(glasanje): checkpoint $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
